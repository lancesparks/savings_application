<div
  class="flex flex-col items-center justify-center gap-4 p-16 border border-dashed border-neutral-600 rounded-xl min-h-[500px]"
>
  <!-- Icon -->
  <div class="text-neutral-400 text-4xl"><img src="images/icon-target.svg" alt="🎯" /></div>

  <!-- Text -->
  <div class="flex flex-col items-center gap-2 text-center">
    <h3 class="font-semibold text-preset-2 text-neutral-0">No goals yet</h3>
    <p class="text-neutral-300 text-preset-5 max-w-xs">
      Start saving for something that matters. Create your first goal and track your progress.
    </p>
  </div>

  <!-- Button -->
  <button
    class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600 transition-colors text-white font-medium px-6 py-3 rounded-full cursor-pointer mt-2"
    (click)="createGoal.emit(true)"
  >
    <span class="text-neutral-900 text-xl">+</span>
    <span class="text-neutral-900 text-preset-5">Create your first goal</span>
  </button>
</div>
