<app-auth-layout
  pageTitle="Forgot your password"
  pageSubTitle="Enter your email address and we'll send you a link to reset it."
  [heroQuote]="heroQuote"
>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <div class="controls flex flex-col pt-6 gap-8">
      <app-input label="Email Address" [control]="forgotPasswordForm.controls.email" />

      <app-button [buttonText]="'Send reset link'" type="submit"></app-button>

      <p class="flex self-center text-neutral-400">
        <span
          class="text-neutral-0 border-b border-neutral-0 ml-2 hover:text-neutral-400 hover:border-neutral-400 transition-colors cursor-pointer"
          (click)="navigateToPage()"
          >Back to sign in</span
        >
      </p>
    </div>
  </form>
</app-auth-layout>
